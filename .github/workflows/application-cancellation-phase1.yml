name: APPLICATION cancellation phase 1

on:
  push:
    branches:
      - feature/application-cancellation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Repair generated documentation literal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/application-cancellation-phase1.mjs')
          text = path.read_text()
          start = text.index('`## 11. キャンセルポリシー')
          end = text.index('`,\n);', start)
          body = text[start + 1:end].replace('`', "'")
          path.write_text(text[:start + 1] + body + text[end:])
          PY

      - name: Apply guarded source changes
        run: node .github/scripts/application-cancellation-phase1.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify cancellation foundation
        run: |
          test -f src/features/application/domain/cancellation.ts
          grep -q 'cancellation_mode' src/features/application/server/submitApplication.ts
          grep -q 'cancellation_mode' src/app/api/application/manage/route.ts
          grep -q 'cancellation_mode' src/app/api/application/public/route.ts
          grep -q 'paymentMethod === "none" || hasCalendarPricing' src/app/api/application/manage/route.ts
          grep -q 'キャンセル' src/components/parari/settings/ApplicationPolicySettings.tsx

      - name: Remove one-time tooling
        run: |
          rm .github/scripts/application-cancellation-phase1.mjs
          rm .github/workflows/application-cancellation-phase1.yml

      - name: Commit verified changes
        run: |
          git config user.name "kanae-muraiso"
          git config user.email "kanae@muraiso.jp"
          git add -A
          git commit -m "Add APPLICATION cancellation policy foundation"
          git push
