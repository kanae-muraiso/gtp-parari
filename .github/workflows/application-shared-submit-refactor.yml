name: APPLICATION shared-submit refactor

on:
  push:
    branches:
      - refactor/application-shared-submit-service

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[shared-submit-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update architecture map
        run: node .github/scripts/update-application-map-shared-submit.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Remove one-time tooling
        run: |
          rm .github/scripts/update-application-map-shared-submit.mjs
          rm .github/workflows/application-shared-submit-refactor.yml
          git checkout -- tsconfig.tsbuildinfo || true

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Share APPLICATION submit service [shared-submit-verified]"
          git push
