name: APPLICATION payment hold phase 5

on:
  push:
    branches:
      - feature/application-payment-hold-db

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run APPLICATION payment hold phase 5 boundary integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/application-payment-hold-db
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preserve generated build cache
        run: cp tsconfig.tsbuildinfo /tmp/tsconfig.tsbuildinfo

      - name: Apply guarded approval boundary changes
        run: node .github/scripts/application-payment-hold-phase5.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Verify approval hold semantics
        run: |
          grep -q 'application.payment_method === "parari"' src/app/api/application/entries/route.ts
          grep -q 'approvedAt.getTime() + 15 \* 60_000' src/app/api/application/entries/route.ts
          grep -q 'payment_hold_expires_at:' src/app/api/application/entries/route.ts
          grep -q '"expired"' src/app/api/application/entries/route.ts
          grep -q '"qualification_status",' src/app/api/application/entries/route.ts
          grep -q '"payment_status",' src/app/api/application/entries/route.ts

      - name: Restore generated build cache
        run: cp /tmp/tsconfig.tsbuildinfo tsconfig.tsbuildinfo

      - name: Remove temporary workflow and script
        run: |
          rm .github/scripts/application-payment-hold-phase5.mjs
          rm .github/workflows/application-payment-hold-phase5.yml

      - name: Commit boundary integration
        run: |
          git config user.name kanae-muraiso
          git config user.email kanae@muraiso.jp
          git add src/app/api/application/entries/route.ts \
                  tsconfig.tsbuildinfo \
                  .github/scripts/application-payment-hold-phase5.mjs \
                  .github/workflows/application-payment-hold-phase5.yml
          git commit -m 'Harden APPLICATION payment hold boundaries'
          git push origin HEAD:feature/application-payment-hold-db
