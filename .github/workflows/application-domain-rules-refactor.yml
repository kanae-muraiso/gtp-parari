name: APPLICATION domain-rules one-time refactor

on:
  push:
    branches:
      - refactor/application-domain-rules

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[domain-rules-refactor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply extraction
        run: node .github/scripts/refactor-application-domain-rules.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Remove one-time tooling
        run: |
          rm .github/scripts/refactor-application-domain-rules.mjs
          rm .github/workflows/application-domain-rules-refactor.yml
          git checkout -- tsconfig.tsbuildinfo || true

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize APPLICATION domain rules [domain-rules-refactor-applied]"
          git push
