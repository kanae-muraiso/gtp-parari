name: APPLICATION participant cancellation

on:
  push:
    branches:
      - feature/application-participant-cancellation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded participant changes
        run: node .github/scripts/application-cancellation-phase2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify cancellation flow
        run: |
          test -f src/app/api/application/guest-cancel/route.ts
          test -f 'src/app/c/[token]/page.tsx'
          grep -q 'action: "cancel"' src/components/parari/panels/application/ApplicationPanelRenderer.tsx
          grep -q 'cancellation_token' src/features/application/server/submitApplication.ts
          grep -q 'cancellation_token' src/components/parari/panels/application/GuestApplicationPanelRenderer.tsx
          grep -q 'result.entry.status' src/app/api/application/check-in/route.ts

      - name: Remove one-time tooling
        run: |
          rm .github/scripts/application-cancellation-phase2.mjs
          rm .github/workflows/application-cancellation-phase2.yml

      - name: Commit verified changes
        run: |
          git config user.name "kanae-muraiso"
          git config user.email "kanae@muraiso.jp"
          git add -A
          git commit -m "Add participant APPLICATION cancellation flow"
          git push
