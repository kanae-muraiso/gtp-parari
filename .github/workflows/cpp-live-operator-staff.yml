name: CPP LIVE operator staff checks
on:
  pull_request:
    paths:
      - "src/components/parari/cpp/CppLiveOperators.tsx"
      - "src/app/my/cpp/live/page.tsx"
      - "supabase/migrations/*cpp_live_operator_presence*"
      - ".github/workflows/cpp-live-operator-staff.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Build with dummy env
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          STRIPE_SECRET_KEY: sk_test_placeholder
        run: npm run build
