name: PARARI LIVE checks

on:
  pull_request:
    paths:
      - "src/lib/parari/live/**"
      - "src/app/api/parari/live/**"
      - "src/components/parari/matching/CppAudioPilot.tsx"
      - "src/app/my/cpp/live/audio-pilot/**"
      - "scripts/test-live-daily-foundation.cjs"
      - "package.json"
      - ".github/workflows/parari-live-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check CPP LIVE source invariants
        run: npm run test:live-daily
      - name: TypeScript check
        run: npm run typecheck
