name: CPP Workbook Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Repository hygiene check
        run: npm run check:repo-hygiene

      - name: CPP route regression check
        run: npm run test:cpp-routes

      - name: CPP AI authentication and privacy check
        run: npm run test:cpp-ai

      - name: Participation navigation regression check
        run: npm run test:participation-navigation

      - name: Legacy PAGE URL and authorization check
        run: npm run test:legacy-page-routes

      - name: Unified reader compatibility and progress check
        run: npm run test:unified-viewer

      - name: English authoring entitlement and interaction check
        run: npm run test:english-authoring
