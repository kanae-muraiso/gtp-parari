name: CPP unified alumni LIVE room checks
on:
  pull_request:
    paths:
      - "src/components/parari/cpp/CppLiveUnifiedVenue.tsx"
      - "src/components/parari/cpp/CppLiveEventRoom.tsx"
      - "supabase/migrations/*cpp_live_unified_event_room*"
      - ".github/workflows/cpp-unified-alumni-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Build with placeholders
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          STRIPE_SECRET_KEY: sk_test_placeholder
        run: npm run build
