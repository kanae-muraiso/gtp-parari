name: APPLICATION map domain update

on:
  push:
    branches:
      - refactor/application-domain-rules

permissions:
  contents: write

jobs:
  update-map:
    if: ${{ !contains(github.event.head_commit.message, '[domain-map-updated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update architecture map
        run: node .github/scripts/update-application-map-domain.mjs

      - name: Remove one-time tooling
        run: |
          rm .github/scripts/update-application-map-domain.mjs
          rm .github/workflows/application-map-domain-update.yml

      - name: Commit map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update APPLICATION domain map [domain-map-updated]"
          git push
