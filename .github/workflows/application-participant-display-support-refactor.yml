name: APPLICATION participant display-support refactor

on:
  push:
    branches:
      - refactor/application-participant-display-support

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[participant-display-support-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract display helpers
        run: node .github/scripts/refactor-application-participant-display-support.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Remove one-time tooling
        run: |
          rm .github/scripts/refactor-application-participant-display-support.mjs
          rm .github/workflows/application-participant-display-support-refactor.yml
          git checkout -- tsconfig.tsbuildinfo || true

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract APPLICATION participant display helpers [participant-display-support-verified]"
          git push
