name: APPLICATION payment hold phase 3

on:
  push:
    branches:
      - feature/application-payment-hold-db

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded submit integration
        run: node .github/scripts/application-payment-hold-phase3.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Verify APPLICATION submit flow
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('src/features/application/server/submitApplication.ts', 'utf8');
          const required = [
            'expire_application_payment_holds',
            'create_application_entry_atomic',
            'application_capacity_reached',
            'p_capacity_limit: effectiveLimit',
          ];
          for (const text of required) {
            if (!s.includes(text)) throw new Error(`missing ${text}`);
          }
          if (s.includes('CAPACITY_HOLDING_STATUSES')) throw new Error('legacy capacity count remains');
          if (s.includes('.from("application_entries")\n    .insert(')) throw new Error('direct application entry insert remains');
          console.log('APPLICATION atomic submit integration verified');
          NODE

      - name: Restore generated build cache
        run: git checkout -- tsconfig.tsbuildinfo || true

      - name: Remove temporary workflow and script
        run: |
          rm -f .github/scripts/application-payment-hold-phase3.mjs
          rm -f .github/workflows/application-payment-hold-phase3.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Connect APPLICATION submit to atomic payment hold"
            git push
          fi
